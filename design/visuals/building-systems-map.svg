<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 566" role="img" aria-label="შენობის ჭრილი სისტემების განლაგებით: ვიდეოკონტროლი, ქსელი, დაშვება, აუდიო-ვიზუალური, სერვერული და კვება">
<style>text{font-family:"Inter Variable","Noto Sans Georgian Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}text.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Georgian Variable",monospace;letter-spacing:.1em;text-transform:uppercase}</style>
      <defs>
        <linearGradient id="bgsky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0C1730"/><stop offset="100%" stop-color="#060B18"/></linearGradient>
        <linearGradient id="floorg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#18294A" stop-opacity=".95"/><stop offset="100%" stop-color="#101C34" stop-opacity=".8"/></linearGradient>
        <linearGradient id="slabg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#33497099"/><stop offset="0%" stop-color="#2E4470"/><stop offset="100%" stop-color="#1F3053"/></linearGradient>
        <linearGradient id="riserg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="100%" stop-color="#1D6FF2" stop-opacity=".08"/></linearGradient>
        <pattern id="grid2" width="26" height="26" patternUnits="userSpaceOnUse">
          <path d="M26 0 L0 0 0 26" fill="none" stroke="#7FA8FF" stroke-opacity=".055" stroke-width="1"/></pattern>
        <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="9" stroke="#7FA8FF" stroke-opacity=".16" stroke-width="1.4"/></pattern>
        <radialGradient id="pinglow"><stop offset="0%" stop-color="#22D3EE" stop-opacity=".4"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
        <radialGradient id="skyglow" cx="42%" cy="20%" r="55%">
          <stop offset="0%" stop-color="#1D6FF2" stop-opacity=".2"/><stop offset="100%" stop-color="#1D6FF2" stop-opacity="0"/></radialGradient>
      </defs>

      <rect width="1060" height="566" fill="url(#bgsky)"/>
      <rect width="1060" height="566" fill="url(#grid2)"/>
      <ellipse cx="420" cy="120" rx="420" ry="220" fill="url(#skyglow)"/>

      <!-- ground -->
      <line x1="60" y1="490" x2="700" y2="490" stroke="#7FA8FF" stroke-opacity=".4" stroke-width="2"/>
      <rect x="60" y="490" width="640" height="15" fill="url(#hatch)"/>

      <!-- floor volumes -->
      <g fill="url(#floorg)">
        <rect x="162" y="92" width="516" height="76"/><rect x="162" y="180" width="516" height="76"/>
        <rect x="162" y="268" width="516" height="76"/><rect x="162" y="356" width="516" height="76"/>
      </g>
      <rect x="162" y="444" width="516" height="46" fill="#0B1425"/>
      <!-- slabs -->
      <g fill="url(#slabg)">
        <rect x="150" y="78" width="540" height="14" rx="2"/>
        <rect x="156" y="168" width="528" height="12"/><rect x="156" y="256" width="528" height="12"/>
        <rect x="156" y="344" width="528" height="12"/><rect x="156" y="432" width="528" height="12"/>
      </g>
      <rect x="162" y="92" width="516" height="398" fill="none" stroke="#7FA8FF" stroke-opacity=".26"/>
      <g stroke="#7FA8FF" stroke-opacity=".1" stroke-dasharray="4 5">
        <path d="M312 92 V168 M312 180 V256 M312 268 V344 M312 356 V432"/>
        <path d="M480 92 V168 M480 180 V256 M480 268 V344 M480 356 V432"/>
      </g>

      <!-- floor labels -->
      <g text-anchor="end">
        <text x="140" y="122" font-size="13" fill="#C7D5EC">სართული 4</text><text x="140" y="140" font-size="11.5" fill="#63769A">ოფისები</text>
        <text x="140" y="210" font-size="13" fill="#C7D5EC">სართული 3</text><text x="140" y="228" font-size="11.5" fill="#63769A">სამუშაო სივრცე</text>
        <text x="140" y="298" font-size="13" fill="#C7D5EC">სართული 2</text><text x="140" y="316" font-size="11.5" fill="#63769A">საკონფერენციო</text>
        <text x="140" y="386" font-size="13" fill="#C7D5EC">სართული 1</text><text x="140" y="404" font-size="11.5" fill="#63769A">ლობი და მიღება</text>
        <text x="140" y="466" font-size="13" fill="#C7D5EC">ტექნიკური</text><text x="140" y="484" font-size="11.5" fill="#63769A">სერვერული</text>
      </g>

      <!-- riser -->
      <rect x="624" y="92" width="42" height="398" fill="url(#riserg)"/>
      <rect x="624" y="92" width="42" height="398" fill="none" stroke="#22D3EE" stroke-opacity=".34" stroke-dasharray="3 4"/>

      <!-- cable routes -->
      <g fill="none" stroke="#22D3EE" stroke-opacity=".42" stroke-width="1.3">
        <path d="M236 66 V84 H645"/>
        <path d="M368 112 V100 H645"/>
        <path d="M454 206 H645"/>
        <path d="M262 276 H645"/>
        <path d="M244 364 H645"/>
        <path d="M645 92 V460 H402"/>
      </g>
      <g class="pulse" fill="#67E8F9">
        <circle r="2.6" cx="645"><animate attributeName="cy" values="96;456" dur="2.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/></circle>
        <circle r="2.6" cx="645"><animate attributeName="cy" values="96;456" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" begin="-1.4s" repeatCount="indefinite"/></circle>
      </g>

      <!-- roof: dome camera -->
      <g>
        <path d="M236 78 V64" stroke="#7FA8FF" stroke-opacity=".5" stroke-width="2"/>
        <path d="M222 64 a14 14 0 0 1 28 0 z" fill="#22375E" stroke="#7FA8FF" stroke-opacity=".6"/>
        <circle cx="236" cy="58" r="4" fill="#67E8F9"/>
        <path d="M236 66 L192 92 L280 92 Z" fill="#22D3EE" fill-opacity=".1"/>
      </g>
      <!-- roof: antenna -->
      <g stroke="#7FA8FF" stroke-opacity=".45" fill="none"><path d="M570 78 V44 M558 52 h24 M562 62 h16"/></g>
      <g class="pulse" fill="none" stroke="#22D3EE">
        <circle cx="570" cy="44" r="8"><animate attributeName="r" values="4;22" dur="3s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values=".5;0" dur="3s" repeatCount="indefinite"/></circle>
      </g>

      <!-- L4: Wi-Fi AP + desks -->
      <g>
        <rect x="354" y="94" width="28" height="8" rx="2" fill="#22375E" stroke="#7FA8FF" stroke-opacity=".55"/>
        <g stroke="#22D3EE" stroke-opacity=".5" fill="none">
          <path d="M350 114 a24 24 0 0 1 36 0"/><path d="M358 126 a15 15 0 0 1 20 0"/></g>
      </g>
      <g fill="#7FA8FF" fill-opacity=".18">
        <rect x="186" y="148" width="46" height="8" rx="2"/><rect x="244" y="148" width="46" height="8" rx="2"/>
        <rect x="520" y="148" width="46" height="8" rx="2"/><rect x="578" y="148" width="46" height="8" rx="2"/>
      </g>
      <g fill="#7FA8FF" fill-opacity=".12">
        <circle cx="209" cy="138" r="6"/><circle cx="267" cy="138" r="6"/><circle cx="543" cy="138" r="6"/><circle cx="601" cy="138" r="6"/>
      </g>

      <!-- L3: access door -->
      <g>
        <rect x="426" y="196" width="6" height="60" fill="#22375E" stroke="#7FA8FF" stroke-opacity=".55"/>
        <path d="M432 200 h30" stroke="#7FA8FF" stroke-opacity=".3" stroke-dasharray="3 3"/>
        <rect x="436" y="204" width="12" height="16" rx="2.5" fill="#0A1223" stroke="#22D3EE" stroke-opacity=".8"/>
        <circle cx="442" cy="212" r="2.4" fill="#67E8F9"/>
        <g class="pulse" stroke="#22D3EE" fill="none">
          <path d="M453 206 a9 9 0 0 1 0 12" stroke-opacity=".55">
            <animate attributeName="stroke-opacity" values=".15;.7;.15" dur="2.4s" repeatCount="indefinite"/></path></g>
      </g>
      <g fill="#7FA8FF" fill-opacity=".16">
        <rect x="196" y="236" width="42" height="8" rx="2"/><rect x="250" y="236" width="42" height="8" rx="2"/>
        <rect x="520" y="236" width="42" height="8" rx="2"/>
      </g>

      <!-- L2: AV room -->
      <g>
        <rect x="214" y="284" width="96" height="46" rx="3" fill="#0A1223" stroke="#7FA8FF" stroke-opacity=".5"/>
        <rect x="220" y="290" width="84" height="34" rx="2" fill="#1D6FF2" fill-opacity=".22"/>
        <path d="M262 330 v8 M246 340 h32" stroke="#7FA8FF" stroke-opacity=".4"/>
        <g fill="#7FA8FF" fill-opacity=".22">
          <rect x="350" y="300" width="94" height="9" rx="3"/>
          <circle cx="346" cy="316" r="6"/><circle cx="380" cy="321" r="6"/><circle cx="414" cy="321" r="6"/><circle cx="448" cy="316" r="6"/></g>
        <g fill="#7FA8FF" fill-opacity=".14"><rect x="520" y="300" width="94" height="9" rx="3"/>
          <circle cx="540" cy="318" r="5.5"/><circle cx="572" cy="318" r="5.5"/><circle cx="604" cy="318" r="5.5"/></g>
      </g>

      <!-- L1: lobby -->
      <g>
        <rect x="226" y="386" width="10" height="42" rx="2" fill="#22375E" stroke="#7FA8FF" stroke-opacity=".55"/>
        <rect x="272" y="386" width="10" height="42" rx="2" fill="#22375E" stroke="#7FA8FF" stroke-opacity=".55"/>
        <path d="M236 396 h36 M236 404 h36" stroke="#22D3EE" stroke-opacity=".45"/>
        <rect x="222" y="366" width="18" height="10" rx="2" fill="#0A1223" stroke="#22D3EE" stroke-opacity=".65"/>
        <path d="M231 376 L204 410 L258 410 Z" fill="#22D3EE" fill-opacity=".09"/>
        <rect x="350" y="402" width="76" height="26" rx="3" fill="#7FA8FF" fill-opacity=".15"/>
        <text x="388" y="419" font-size="11" fill="#8394B2" text-anchor="middle">მიღება</text>
        <g fill="#7FA8FF" fill-opacity=".12"><rect x="520" y="404" width="100" height="24" rx="4"/></g>
      </g>

      <!-- tech floor: rack + UPS -->
      <g>
        <rect x="334" y="448" width="68" height="40" rx="3" fill="#0F1A30" stroke="#22D3EE" stroke-opacity=".6"/>
        <g stroke="#7FA8FF" stroke-opacity=".3"><path d="M334 458 h68 M334 468 h68 M334 478 h68"/></g>
        <g fill="#22C55E"><circle cx="394" cy="453" r="2"/><circle cx="394" cy="463" r="2"/></g>
        <circle cx="394" cy="473" r="2" fill="#22D3EE" class="blink"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <rect x="422" y="456" width="46" height="32" rx="3" fill="#0F1A30" stroke="#7FA8FF" stroke-opacity=".5"/>
        <path d="M440 462 l-5 9 h5 l-3 8 8 -11 h-5 z" fill="#F59E0B" fill-opacity=".9"/>
        <text x="445" y="485" font-size="9" fill="#63769A" text-anchor="middle">UPS</text>
        <rect x="520" y="452" width="60" height="36" rx="3" fill="#101E38" stroke="#7FA8FF" stroke-opacity=".3"/>
        <g stroke="#7FA8FF" stroke-opacity=".22"><path d="M520 462 h60 M520 472 h60 M520 482 h60"/></g>
      </g>

      <!-- pins -->
      <g font-size="12.5" font-weight="700" text-anchor="middle">
        <g><circle cx="236" cy="32" r="19" fill="url(#pinglow)"/><circle cx="236" cy="32" r="12" fill="#1D6FF2"/><text x="236" y="36.5" fill="#fff">1</text></g>
        <g><circle cx="410" cy="118" r="19" fill="url(#pinglow)"/><circle cx="410" cy="118" r="12" fill="#1D6FF2"/><text x="410" y="122.5" fill="#fff">2</text></g>
        <g><circle cx="486" cy="212" r="19" fill="url(#pinglow)"/><circle cx="486" cy="212" r="12" fill="#1D6FF2"/><text x="486" y="216.5" fill="#fff">3</text></g>
        <g><circle cx="190" cy="300" r="19" fill="url(#pinglow)"/><circle cx="190" cy="300" r="12" fill="#1D6FF2"/><text x="190" y="304.5" fill="#fff">4</text></g>
        <g><circle cx="190" cy="396" r="19" fill="url(#pinglow)"/><circle cx="190" cy="396" r="12" fill="#1D6FF2"/><text x="190" y="400.5" fill="#fff">5</text></g>
        <g><circle cx="308" cy="468" r="19" fill="url(#pinglow)"/><circle cx="308" cy="468" r="12" fill="#1D6FF2"/><text x="308" y="472.5" fill="#fff">6</text></g>
        <g><circle cx="490" cy="470" r="19" fill="url(#pinglow)"/><circle cx="490" cy="470" r="12" fill="#1D6FF2"/><text x="490" y="474.5" fill="#fff">7</text></g>
      </g>

      <!-- legend -->
      <line x1="716" y1="56" x2="716" y2="524" stroke="#7FA8FF" stroke-opacity=".14"/>
      <text x="744" y="62" class="m" font-size="10.5" fill="#22D3EE">სისტემები ობიექტზე</text>
      <g>
        <g><circle cx="752" cy="102" r="11.5" fill="#1D6FF2"/><text x="752" y="106.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
          <text x="776" y="99" font-size="14.5" fill="#F2F6FF">გარე ვიდეოკონტროლი</text>
          <text x="776" y="117" font-size="12" fill="#8394B2">პერიმეტრი, სახურავი, შესასვლელი</text></g>
        <g><circle cx="752" cy="164" r="11.5" fill="#1D6FF2"/><text x="752" y="168.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
          <text x="776" y="161" font-size="14.5" fill="#F2F6FF">ქსელი და Wi-Fi</text>
          <text x="776" y="179" font-size="12" fill="#8394B2">წვდომის წერტილები, VLAN, PoE</text></g>
        <g><circle cx="752" cy="226" r="11.5" fill="#1D6FF2"/><text x="752" y="230.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
          <text x="776" y="223" font-size="14.5" fill="#F2F6FF">დაშვების კონტროლი</text>
          <text x="776" y="241" font-size="12" fill="#8394B2">წამკითხველები, კონტროლერი, ჟურნალი</text></g>
        <g><circle cx="752" cy="288" r="11.5" fill="#1D6FF2"/><text x="752" y="292.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
          <text x="776" y="285" font-size="14.5" fill="#F2F6FF">აუდიო-ვიზუალური</text>
          <text x="776" y="303" font-size="12" fill="#8394B2">ეკრანები, AV over IP, ხმა</text></g>
        <g><circle cx="752" cy="350" r="11.5" fill="#1D6FF2"/><text x="752" y="354.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
          <text x="776" y="347" font-size="14.5" fill="#F2F6FF">ლობი და შესვლის კონტროლი</text>
          <text x="776" y="365" font-size="12" fill="#8394B2">ტურნიკეტი, მიღების კამერა</text></g>
        <g><circle cx="752" cy="412" r="11.5" fill="#1D6FF2"/><text x="752" y="416.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
          <text x="776" y="409" font-size="14.5" fill="#F2F6FF">სერვერული და რეკი</text>
          <text x="776" y="427" font-size="12" fill="#8394B2">კომუტაცია, NVR, სერვერები</text></g>
        <g><circle cx="752" cy="474" r="11.5" fill="#1D6FF2"/><text x="752" y="478.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text>
          <text x="776" y="471" font-size="14.5" fill="#F2F6FF">კვება და UPS</text>
          <text x="776" y="489" font-size="12" fill="#8394B2">უწყვეტი კვება, დაცვა</text></g>
      </g>
      <g>
        <rect x="740" y="506" width="300" height="1" fill="#7FA8FF" fill-opacity=".14"/>
        <rect x="740" y="518" width="26" height="11" rx="2" fill="#22D3EE" fill-opacity=".22" stroke="#22D3EE" stroke-opacity=".5" stroke-dasharray="3 3"/>
        <text x="776" y="527" font-size="12" fill="#8394B2">ვერტიკალური საკაბელო მაგისტრალი</text>
      </g>
    </svg>
