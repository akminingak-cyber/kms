<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="ექვსეტაპიანი პროცესის დიაგრამა აღმავალ ღერძზე, დაჯგუფებული სამ ფაზად">
<style>text{font-family:"Inter Variable","Noto Sans Georgian Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}text.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Georgian Variable",monospace;letter-spacing:.1em;text-transform:uppercase}</style>
      <defs>
        <linearGradient id="railg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7FA8FF"/><stop offset="55%" stop-color="#1D6FF2"/><stop offset="100%" stop-color="#0EA5C0"/></linearGradient>
        <linearGradient id="phase1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1D6FF2" stop-opacity=".09"/><stop offset="100%" stop-color="#1D6FF2" stop-opacity="0"/></linearGradient>
        <linearGradient id="phase2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1D6FF2" stop-opacity=".15"/><stop offset="100%" stop-color="#1D6FF2" stop-opacity="0"/></linearGradient>
        <linearGradient id="phase3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#22D3EE" stop-opacity=".2"/><stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
        <pattern id="lgrid" width="25" height="25" patternUnits="userSpaceOnUse">
          <path d="M25 0 L0 0 0 25" fill="none" stroke="#0F1A30" stroke-opacity=".05" stroke-width="1"/></pattern>
      </defs>
      <rect width="1000" height="440" fill="#F6F8FC"/>
      <rect width="1000" height="440" fill="url(#lgrid)"/>

      <!-- phase bands -->
      <rect x="34" y="52" width="348" height="292" rx="12" fill="url(#phase1)"/>
      <rect x="394" y="52" width="348" height="292" rx="12" fill="url(#phase2)"/>
      <rect x="754" y="52" width="212" height="292" rx="12" fill="url(#phase3)"/>
      <g class="m" font-size="10" fill="#4A5A73">
        <text x="50" y="74">მოსამზადებელი ფაზა</text><text x="410" y="74">განხორციელება</text><text x="770" y="74">მხარდაჭერა</text>
      </g>
      <g stroke="#0F1A30" stroke-opacity=".09" stroke-dasharray="4 5"><path d="M388 60 V336 M748 60 V336"/></g>

      <!-- rail -->
      <path id="rail" d="M96 262 C 150 262 152 230 206 230 C 260 230 262 198 316 198
                         C 390 198 396 166 470 166 C 555 166 560 134 640 134 C 745 134 750 110 850 110"
            fill="none" stroke="url(#railg)" stroke-width="3" stroke-linecap="round"/>
      <g class="pulse" fill="#0EA5C0">
        <circle r="5"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#rail"/></animateMotion>
          <animate attributeName="opacity" values="0;.9;.9;0" dur="7s" repeatCount="indefinite"/></circle>
      </g>

      <!-- nodes -->
      <g>
        <g><circle cx="96" cy="262" r="25" fill="#fff" stroke="#1D6FF2" stroke-width="2.5"/>
          <text x="96" y="269" font-size="16" font-weight="700" fill="#1D6FF2" text-anchor="middle">01</text></g>
        <g><circle cx="206" cy="230" r="25" fill="#fff" stroke="#1D6FF2" stroke-width="2.5"/>
          <text x="206" y="237" font-size="16" font-weight="700" fill="#1D6FF2" text-anchor="middle">02</text></g>
        <g><circle cx="316" cy="198" r="25" fill="#fff" stroke="#1D6FF2" stroke-width="2.5"/>
          <text x="316" y="205" font-size="16" font-weight="700" fill="#1D6FF2" text-anchor="middle">03</text></g>
        <g><circle cx="470" cy="166" r="25" fill="#1D6FF2"/>
          <text x="470" y="173" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">04</text></g>
        <g><circle cx="640" cy="134" r="25" fill="#1D6FF2"/>
          <text x="640" y="141" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">05</text></g>
        <g><circle cx="850" cy="110" r="25" fill="#0EA5C0"/>
          <text x="850" y="117" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">06</text></g>
      </g>

      <!-- connectors + labels -->
      <g stroke="#0F1A30" stroke-opacity=".16" stroke-dasharray="3 4">
        <path d="M96 289 V300 M206 257 V268 M316 225 V236 M470 193 V204 M640 161 V172 M850 137 V148"/>
      </g>
      <g fill="#0D1420" font-size="14" font-weight="600" text-anchor="middle">
        <text x="96" y="316">კონსულტაცია</text><text x="206" y="284">დათვალიერება</text><text x="316" y="252">პროექტირება</text>
        <text x="470" y="220">მონტაჟი</text><text x="640" y="188">ტესტირება</text><text x="850" y="164">მხარდაჭერა</text>
      </g>
      <g fill="#4A5A73" font-size="11.5" text-anchor="middle">
        <text x="96" y="334">მოთხოვნების ანალიზი</text><text x="206" y="302">ობიექტის გაზომვა</text><text x="316" y="270">და სპეციფიკაცია</text>
        <text x="470" y="238">და ინტეგრაცია</text><text x="640" y="206">და ჩაბარება</text><text x="850" y="182">და განვითარება</text>
      </g>

      <!-- baseline -->
      <line x1="34" y1="380" x2="966" y2="380" stroke="#0F1A30" stroke-opacity=".14"/>
      <path d="M950 376 l10 4 -10 4" fill="none" stroke="#0F1A30" stroke-opacity=".3"/>
      <g class="m" font-size="10" fill="#4A5A73">
        <text x="34" y="402">პირველი შეხება</text><text x="966" y="402" text-anchor="end">ექსპლუატაცია</text>
      </g>
    </svg>
