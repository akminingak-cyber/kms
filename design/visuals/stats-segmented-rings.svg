        <text x="360" y="216">კლინიკა, ოფისი,</text><text x="360" y="232">სასტუმრო, საწარმო</text>
        <text x="600" y="216">ქსელი, უსაფრთხოება,</text><text x="600" y="232">ჭკვიანი, მართვა</text>
        <text x="840" y="216">კონსულტაციიდან</text><text x="840" y="232">განვითარებამდე</text>
      </g>
      <g stroke="#7FA8FF" stroke-opacity=".12"><path d="M240 44 V238 M480 44 V238 M720 44 V238"/></g>
