<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 262" role="img" aria-label="ოთხი სეგმენტირებული რგოლი: 8 მომსახურება, 8 ინდუსტრია, 4 ტექნოლოგიური დომენი, 6 ეტაპი">
<style>text{font-family:"Inter Variable","Noto Sans Georgian Variable",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}text.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Georgian Variable",monospace;letter-spacing:.1em;text-transform:uppercase}</style>
      <rect width="960" height="262" fill="#060B18"/>
      <g fill="none" stroke-width="9" stroke-linecap="butt" transform="rotate(-90 0 0)">
        <circle cx="-110" cy="120" r="46" stroke="#1E2F4F" stroke-dasharray="30.13 6"/>
        <circle cx="-110" cy="360" r="46" stroke="#1E2F4F" stroke-dasharray="30.13 6"/>
        <circle cx="-110" cy="600" r="46" stroke="#1E2F4F" stroke-dasharray="66.26 6"/>
        <circle cx="-110" cy="840" r="46" stroke="#1E2F4F" stroke-dasharray="42.17 6"/>
        <circle cx="-110" cy="120" r="46" stroke="#1D6FF2" stroke-dasharray="30.13 6"/>
