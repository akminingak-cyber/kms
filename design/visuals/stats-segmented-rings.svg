        <circle cx="-110" cy="600" r="46" stroke="#7FA8FF" stroke-dasharray="66.26 6"/>
        <circle cx="-110" cy="840" r="46" stroke="#67E8F9" stroke-dasharray="42.17 6"/>
      </g>
      <g text-anchor="middle" fill="#F2F6FF" font-size="38" font-weight="700" style="font-variant-numeric:tabular-nums">
        <text x="120" y="124">8</text><text x="360" y="124">8</text><text x="600" y="124">4</text><text x="840" y="124">6</text>
      </g>
      <g text-anchor="middle" fill="#F2F6FF" font-size="14.5" font-weight="600">
