<!doctype html>
<html lang="ka-GE" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060B18" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Removed the moment the bundle runs. Its only job is to keep the
         reveal-on-scroll wrapper from hiding prerendered content when
         JavaScript is unavailable. -->
    <script>
      document.documentElement.classList.remove('no-js');
    </script>

    <!-- Fonts are self-hosted; see the @font-face rules in src/styles/index.css.
         The prerenderer injects font and locale-chunk preload hints per page,
         along with the per-route title, description, canonical, hreflang,
         Open Graph and JSON-LD. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KMS" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>KMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
