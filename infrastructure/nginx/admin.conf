# Serving the operator panel.
#
# The panel and the admin API are on **one origin**. That is what removes
# cross-origin credential handling entirely — no CORS, no preflight, no
# `Access-Control-Allow-Credentials` decision to get wrong on the surface that
# reaches rights, pricing and subscriber data.
#
# ## Every `add_header` is at server level, and that is not a style choice
#
# nginx's `add_header` does not accumulate: a `location` block that declares one
# **discards every header inherited from the server block**. Putting a
# `Cache-Control` in `location /assets/` would therefore silently drop the
# Content-Security-Policy and the clickjacking headers from exactly the
# responses that carry the application.
#
# That failure is invisible in a config review and invisible in a functional
# test — the page loads perfectly either way. It was caught here by running the
# configuration and reading the response headers, which is the only way it can
# be caught.
#
# So cache lifetime is selected by a `map` into one variable, and there is
# exactly one set of `add_header` directives in the file.

# The admin API. In local development that is the API edge; in every other
# environment it is a service-discovery name or a load balancer, and this is the
# only line in the file that changes.
upstream core-api-admin {
    server nginx:80;
    keepalive 16;
}

# Content-hashed assets can be cached forever; the shell must never be, or a
# deploy leaves operators on the previous bundle until they clear their cache.
map $uri $kms_admin_cache {
    default              "no-cache";
    ~^/assets/           "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    # Internal tooling: never indexed, never linked from a viewer-facing page.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $kms_admin_cache always;

    # The panel holds a staff token in memory, so what matters is that no script
    # which is not ours can run on this origin. `script-src 'self'` with no
    # `unsafe-inline` leaves an injected tag nowhere to load from, and
    # `connect-src 'self'` leaves an exfiltration attempt nowhere to send to.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location /api/ {
        proxy_pass http://core-api-admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A single-page application: unknown paths serve the shell and the router
    # decides. Without this a refresh on /decisions is a 404, which for a panel
    # people bookmark is a daily annoyance.
    location / {
        try_files $uri /index.html;
    }
}
