# core-api edge configuration.
#
# In production the admin surface is served on its own hostname with its own
# network policy (docs/api/surfaces.md); this file is the local-development
# equivalent, where both share one origin.

server {
    listen 80 default_server;
    server_name _;
    root /app/public;
    index index.php;

    charset utf-8;
    client_max_body_size 2m;

    # Do not advertise the stack.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Liveness must not be logged: it runs continuously and would drown the log.
    location = /health {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass core-api:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 30s;
    }

    # Never serve dotfiles: .env must not be reachable even by accident.
    location ~ /\. {
        deny all;
    }
}
