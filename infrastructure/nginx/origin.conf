# The media origin.
#
# The origin is the **system of record for media**. A CDN is a cache in front of
# it, and deleting the CDN must lose nothing but performance (ADR-0008).
#
# Three things here carry most of the weight, and each corresponds to a failure
# that is expensive and hard to see:
#
#  1. **Authorization is delegated to core-api by sub-request.** The edge and the
#     origin *validate* a token; they never decide who may watch. A CDN that
#     decides is a CDN that cannot be replaced and a control that cannot be
#     audited.
#  2. **The delivery token is excluded from the cache key.** The whole delivery
#     cost model rests on this. Leave it in and every viewer gets a private copy
#     of every segment; cache offload collapses to zero, origin egress rises by
#     the offload ratio that was being counted on, and nothing looks wrong until
#     the invoice arrives.
#  3. **Cache lifetimes differ sharply by object class.** A live manifest cached
#     like a segment makes every player stall on stale data; a segment cached
#     like a live manifest makes every request reach the origin.
#
# VERIFICATION STATUS
#
# Exercised against a running nginx and a running core-api, with placeholder
# objects standing in for packaged media. Confirmed:
#
#   - a request with no delivery token is refused (403);
#   - a valid token serves the object, and the session is echoed back;
#   - a token replayed against a different publication is refused (403);
#   - a path outside a publication prefix is not served (404);
#   - a live manifest carries a short lifetime, a segment an immutable one;
#   - **a second viewer, with a different token, hits the same cached segment.**
#     That last one is the property the whole delivery cost model rests on, and
#     the only way to establish it is to fetch the same object with two
#     different tokens and observe a cache HIT.
#
# NOT exercised, and to be confirmed where the tooling exists: behaviour with
# real packaged media, byte-range requests against real segments, shield
# behaviour under a genuine miss storm, and the manifest lifetime under live
# traffic. This environment has no packager and no container runtime
# (inspection findings E1, E3). The manifest lifetime in particular is a
# starting point to tune against measured traffic, not a value to set once.

# Upstreams, named by their local-development hostnames — the same convention
# `core-api.conf` follows. In every other environment these resolve to a service
# discovery name or a load balancer, and the addresses are the only lines in
# this file that change.
#
# `core-api-internal` deliberately points at the API edge rather than at PHP-FPM
# directly: the authorization endpoint is HTTP, and going through the edge means
# it is reached exactly as any other client would reach it.
upstream core-api-internal {
    server nginx:80;
    # Authorization runs once per segment. Without connection reuse the
    # three-way handshake alone would dominate the sub-request's cost.
    keepalive 32;
}

upstream kms-media-store {
    server media-store:80;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/origin
                 levels=1:2
                 keys_zone=origin_shield:64m
                 max_size=8g
                 inactive=24h
                 use_temp_path=off;

# The upstream that actually holds the packaged media. In development this is a
# local volume served by the block below; in production it is object storage or
# the packager's own output endpoint.
map $uri $kms_object_class {
    default                      "other";
    ~*/manifest\.(m3u8|mpd)$     "manifest";
    ~*/playlist\.m3u8$           "manifest";
    ~*/init\.mp4$                "init";
    ~*\.(m4s|ts)$                "segment";
}

server {
    listen 8080;
    server_name _;
    root /srv/media;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # Media is fetched cross-origin by browser players, which will not send a
    # delivery token they cannot read. The token travels in the URL for exactly
    # that reason.
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials false always;
    add_header Vary Origin always;

    # Byte-range requests are how a player seeks and how it recovers from a
    # partial segment.
    add_header Accept-Ranges bytes always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # The authorization sub-request.
    #
    # `internal` so it can never be reached from outside: it is called only by
    # `auth_request` below. core-api verifies the token against the publication
    # prefix without touching the database, which is what makes it viable at
    # segment request rate.
    # ---------------------------------------------------------------------
    location = /_kms_authorize {
        internal;

        proxy_pass              http://core-api-internal/internal/v1/delivery/authorize;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        # `auth_request` discards the original request line, so the path and its
        # query — which carry the token — are passed back explicitly.
        proxy_set_header        X-Original-URI $request_uri;
        proxy_set_header        X-Correlation-Id $http_x_correlation_id;

        # A slow authorizer must not hold a media request open: a stall here
        # would be indistinguishable from a stalled stream for every viewer at
        # once.
        proxy_connect_timeout   1s;
        proxy_send_timeout      1s;
        proxy_read_timeout      2s;
    }

    # ---------------------------------------------------------------------
    # Media.
    # ---------------------------------------------------------------------
    location ~ ^/(live|vod)/ {
        auth_request /_kms_authorize;

        # Joins the origin access log to the decision log by session, which is
        # what makes one viewer's complaint traceable from the play button
        # through to an individual segment.
        auth_request_set $kms_session $upstream_http_x_kms_session;

        proxy_cache origin_shield;

        # THE CACHE KEY. Scheme, host and *path* — never `$request_uri`, which
        # would include the query string and therefore the per-viewer token.
        # Changing this line to include arguments is the single most expensive
        # mistake available in this file.
        proxy_cache_key "$scheme$proxy_host$uri";

        # A miss storm — or a CDN failover — must not reach the packagers. One
        # request goes upstream and the rest wait for it.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;

        proxy_pass http://kms-media-store;

        # Lifetimes by object class. Segments are immutable once written and
        # live manifests change constantly; treating them alike breaks one or
        # the other.
        proxy_cache_valid 200 206 1s;
        set $kms_cache_control "no-store";

        if ($kms_object_class = "segment") {
            set $kms_cache_control "public, max-age=31536000, immutable";
        }

        if ($kms_object_class = "init") {
            set $kms_cache_control "public, max-age=31536000, immutable";
        }

        # A live manifest is the hardest object to cache well: it changes every
        # segment and every player requests it repeatedly. Too long and players
        # stall on stale data; too short and every request reaches the origin.
        # This value is a starting point to tune against real traffic, not a
        # setting to establish once.
        if ($kms_object_class = "manifest") {
            set $kms_cache_control "public, max-age=2, stale-while-revalidate=2";
        }

        add_header Cache-Control $kms_cache_control always;
        add_header X-KMS-Session $kms_session always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Anything outside a publication prefix is not media and is not served.
    # Default deny extends to the origin's URL space.
    location / {
        return 404;
    }
}
