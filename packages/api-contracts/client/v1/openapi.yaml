openapi: 3.1.0
info:
  title: KMS TV — Client API
  version: 1.0.0
  description: |
    The viewer-facing surface, called by the web, mobile and television
    applications.

    **This document is the contract, not a description of the implementation**
    (ADR-0010). The API changes here first, in a reviewed pull request; the
    server is then verified against it in both directions by
    `tests/Feature/Contract/OpenApiConformanceTest.php`.

    Within major version 1 this surface is **append-only**. A Smart TV
    application reaches its installed base over months to years and some devices
    effectively stop updating, so a breaking change is not a bug to fix forward —
    it is a population of devices that stops working. See docs/api/versioning.md.
  license:
    name: Proprietary
servers:
  - url: /api/client/v1

tags:
  - name: Authentication
  - name: Catalog
  - name: Channels
  - name: EPG
  - name: Entitlements
  - name: Commerce
  - name: Playback
  - name: Device activation
  - name: Profiles
  - name: Devices
  - name: Platform

paths:
  /config:
    get:
      tags: [Platform]
      operationId: getClientConfig
      summary: Client configuration, fetched at application start-up
      description: |
        How a client learns its minimum supported version and the limits in
        force. Must stay reachable when the rest of the API is degraded: it is
        the main lever the platform retains over clients it cannot otherwise
        change.
      security: []
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientConfig' }

  /auth/register:
    post:
      tags: [Authentication]
      operationId: register
      security: []
      summary: Create an account and its primary profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created; a verification email has been sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      id: { $ref: '#/components/schemas/Identifier' }
                      email_verified: { type: boolean }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      security: []
      summary: Sign in with a password and bind the session to a device
      description: |
        Television device classes are rejected here: a TV has no usable keyboard
        and must use the activation flow, and accepting a password login from
        one would create a second, weaker path to the same session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      security: []
      summary: Rotate a refresh token
      description: |
        Refresh tokens rotate on every use and are tracked as a family.
        Presenting an already-rotated token means either theft or a client bug;
        both revoke the whole family and return `AUTH_REFRESH_REUSE_DETECTED`.
        A client receiving that code must clear its credentials rather than retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      security: []
      description: |
        Always returns 202, whether or not the address is registered.
        Distinguishing the two would make this unauthenticated endpoint an
        account-enumeration oracle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 320 }
      responses:
        '202': { description: Accepted }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      security: []
      description: Resetting a password revokes every existing session for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 255 }
                password: { type: string, minLength: 12, maxLength: 4096 }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/device/authorize:
    post:
      tags: [Device activation]
      operationId: startDeviceActivation
      security: []
      summary: Begin television pairing
      description: |
        Returns two secrets. `user_code` is short and is displayed on the
        television for a person to type elsewhere; `device_code` is
        high-entropy and is what the television polls with. Polling with the
        short code is rejected — it is low-entropy by necessity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_class, device_name]
              properties:
                device_class: { $ref: '#/components/schemas/PairingDeviceClass' }
                device_name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '201':
          description: Activation started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivationStart' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/device/token:
    post:
      tags: [Device activation]
      operationId: pollDeviceActivation
      security: []
      description: |
        Polled by the television until approved. Returns `428` with
        `ACTIVATION_PENDING` while waiting, so a client can tell "keep waiting"
        apart from "give up". Honour the `interval` from the authorize response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/device/approve:
    post:
      tags: [Device activation]
      operationId: approveDeviceActivation
      summary: Approve a television from an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code: { type: string, minLength: 4, maxLength: 16 }
      responses:
        '200':
          description: Approved; the response names the device being authorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  device: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      responses:
        '200':
          description: Profiles for the authenticated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Profile' }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Profiles]
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Identifier' }
    get:
      tags: [Profiles]
      operationId: getProfile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Profiles]
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Profiles]
      operationId: deleteProfile
      description: The primary profile cannot be deleted — an account must always have a viewing subject.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      responses:
        '200':
          description: Registered devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /devices/{deviceId}:
    parameters:
      - name: deviceId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Identifier' }
    delete:
      tags: [Devices]
      operationId: removeDevice
      description: |
        Removes the device and revokes its sessions in the same operation. A
        removal cooldown applies, so the device limit cannot be trivially cycled.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      security: []
      summary: The editorial vocabulary
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '429': { $ref: '#/components/responses/Problem' }

  /channels:
    get:
      tags: [Channels]
      operationId: listChannels
      security: []
      summary: Channel metadata
      description: |
        Publicly cacheable: this varies by locale and territory only. Whether a
        given viewer may watch a channel is a **separate**, private response at
        `/entitlements/channels` — merging the two would either leak one
        viewer's entitlements to another through a shared cache, or give up
        caching on the most frequently fetched payload in the product.
      responses:
        '200':
          description: Channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Channel' } }
        '429': { $ref: '#/components/responses/Problem' }

  /channels/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Identifier' }
    get:
      tags: [Channels]
      operationId: getChannel
      security: []
      responses:
        '200':
          description: Channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Channel' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /channels/{channelId}/now-next:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Identifier' }
    get:
      tags: [EPG]
      operationId: getNowNext
      security: []
      summary: What is on now and next
      responses:
        '200':
          description: Now and next
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { oneOf: [{ $ref: '#/components/schemas/Programme' }, { type: 'null' }] }
                  next: { oneOf: [{ $ref: '#/components/schemas/Programme' }, { type: 'null' }] }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /epg:
    get:
      tags: [EPG]
      operationId: getSchedule
      security: []
      summary: Schedule over a bounded time window
      description: |
        Time-range rather than cursor pagination, deliberately: a schedule query
        is `channel × window` over a time-partitioned table, not an open-ended
        scroll. The range is bounded — an unbounded one would let a single
        request scan every partition — and exceeding it returns
        `SCHEDULE_RANGE_TOO_WIDE`.

        A programme already in progress when the window opens **is** returned:
        overlap, not containment, because that is the one the viewer is watching.
      parameters:
        - name: channel_ids
          in: query
          schema: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Identifier' } }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Programmes in the window
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Programme' } }
                  window:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /entitlements/channels:
    get:
      tags: [Entitlements]
      operationId: getChannelEntitlements
      summary: Which channels this account may watch
      description: |
        The personalised overlay, always `private`. A channel the account cannot
        watch is listed with `entitled: false` rather than hidden, because that
        is what makes upsell possible. Content that must not be disclosed at all
        is absent from `/channels` instead.
      responses:
        '200':
          description: Entitlement overlay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        channel_id: { $ref: '#/components/schemas/Identifier' }
                        entitled: { type: boolean }
                  snapshot_version: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /packages:
    get:
      tags: [Commerce]
      operationId: listPackages
      security: []
      responses:
        '200':
          description: Packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Package' } }
        '429': { $ref: '#/components/responses/Problem' }

  /plans:
    get:
      tags: [Commerce]
      operationId: listPlans
      security: []
      responses:
        '200':
          description: Plans and their prices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Plan' } }
        '429': { $ref: '#/components/responses/Problem' }

  /subscription:
    get:
      tags: [Commerce]
      operationId: getSubscription
      summary: The account's live subscription, if any
      responses:
        '200':
          description: Subscription or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { oneOf: [{ $ref: '#/components/schemas/Subscription' }, { type: 'null' }] }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Commerce]
      operationId: subscribe
      summary: Start a subscription
      description: |
        **No payment is taken.** No payment provider has been selected, and none
        is integrated in this phase — the subscription and the entitlement it
        produces are real, the money movement is not yet built.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { $ref: '#/components/schemas/Identifier' }
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /subscription/{subscriptionId}/cancel:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Identifier' }
    post:
      tags: [Commerce]
      operationId: cancelSubscription
      description: |
        Cancels at the end of the paid period. Cancellation is a decision, not
        an immediate end: the subscriber keeps access until the period they
        already paid for runs out.
      responses:
        '200':
          description: Cancellation scheduled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /subscription/{subscriptionId}/resume:
    parameters:
      - name: subscriptionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Identifier' }
    post:
      tags: [Commerce]
      operationId: resumeSubscription
      responses:
        '200':
          description: Cancellation revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Subscription' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /playback/sessions:
    get:
      tags: [Playback]
      operationId: listPlaybackSessions
      summary: The viewer's own live sessions
      description: |
        "Too many simultaneous streams" is unactionable without being able to
        see which devices are using them, so this is what turns a concurrency
        denial into something a viewer can resolve rather than only be blocked
        by.

        Scoped to the authenticated account. Sessions that have ended are not
        listed.
      responses:
        '200':
          description: Live sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        session_id: { $ref: '#/components/schemas/Identifier' }
                        content_id: { $ref: '#/components/schemas/Identifier' }
                        mode: { type: string, enum: [live, restart, catchup] }
                        device_id: { $ref: '#/components/schemas/Identifier' }
                        device_class: { type: string }
                        started_at: { type: string, format: date-time }
                        last_heartbeat_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Playback]
      operationId: startPlayback
      summary: Authorize playback and start a session
      description: |
        The critical path.

            CAN PLAY = Rights ∧ Entitlement ∧ Parental ∧ Device/Concurrency ∧ Territory

        Checks run cheapest-first and the **first failure wins**, each with its
        own reason code. Rights is evaluated before entitlement deliberately: if
        content is not licensed for a territory that is true regardless of what
        the customer bought, and telling them to upgrade would be wrong.

        Account, profile owner, device and device class all come from the
        device-bound token. `capabilities` is client-asserted and may only ever
        **narrow** what is offered — a client claiming a capability that would
        raise its entitlement is ignored.

        `protection` is `null` until DRM ships in a later phase. It is absent
        rather than stubbed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_id, profile_id, mode]
              properties:
                content_id: { $ref: '#/components/schemas/Identifier' }
                profile_id: { $ref: '#/components/schemas/Identifier' }
                mode: { type: string, enum: [live, restart, catchup] }
                capabilities:
                  type: object
                  properties:
                    formats: { type: array, items: { type: string, enum: [hls, dash] } }
      responses:
        '201':
          description: Authorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackSession' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /playback/sessions/{sessionId}/heartbeat:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Identifier' }
    post:
      tags: [Playback]
      operationId: heartbeatPlayback
      description: |
        Renews the concurrency slot and reissues the delivery targets, and
        periodically re-runs the decision.

        **The response carries fresh delivery targets, and clients must use
        them.** A heartbeat that returned only an expiry would leave a client
        watching a stream whose token it cannot renew.

        A session with no heartbeat past its grace period is closed and its slot
        released, which is what stops a crashed client permanently consuming a
        viewer's allowance.

        The decision is re-run at most once per configured interval rather than
        on every beat — the full check is the most expensive in the platform.
        A `403` here means playback must stop **now**: the reason code is the
        specific one, so a blackout that began mid-event is reported as a
        blackout and not as a generic failure.
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { $ref: '#/components/schemas/Identifier' }
                  heartbeat_interval_seconds: { type: integer }
                  delivery:
                    type: object
                    properties:
                      targets:
                        type: array
                        items: { $ref: '#/components/schemas/DeliveryTarget' }
                      expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: |
            The session must end. Carries the specific reason — for example
            `PLAYBACK_BLACKED_OUT`, `PLAYBACK_NOT_ENTITLED` or
            `PLAYBACK_SESSION_ENDED`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /playback/sessions/{sessionId}/stop:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Identifier' }
    post:
      tags: [Playback]
      operationId: stopPlayback
      responses:
        '204': { description: Session ended and slot released }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A short-lived, device-bound access token. Account, profile and device
        identity all come from the token — never from a request body, because a
        client-asserted device identifier would let a caller inherit another
        device's class, which is an input to the rights decision from Phase 4.

  responses:
    Problem:
      description: RFC 9457 problem document
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Category:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        slug: { type: string }
        name: { type: string }
        parent_id: { oneOf: [{ $ref: '#/components/schemas/Identifier' }, { type: 'null' }] }
        sort_order: { type: integer }

    Channel:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        slug: { type: string }
        name: { type: string }
        number: { type: [integer, 'null'] }
        logo_url: { type: [string, 'null'] }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Identifier' }, { type: 'null' }] }
        catchup_enabled:
          type: boolean
          description: |
            Whether the channel may be recorded at all. Catch-up is a separately
            licensed exploitation, not a feature toggle.

    Programme:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        channel_id: { $ref: '#/components/schemas/Identifier' }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        category_id: { oneOf: [{ $ref: '#/components/schemas/Identifier' }, { type: 'null' }] }
        age_rating: { type: [string, 'null'] }
        season_number: { type: [integer, 'null'] }
        episode_number: { type: [integer, 'null'] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }

    Money:
      type: object
      description: Minor units plus an explicit currency. Never a bare number.
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer }
        currency: { type: string, minLength: 3, maxLength: 3 }
        territory: { type: [string, 'null'] }

    Package:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        slug: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        channel_ids: { type: array, items: { $ref: '#/components/schemas/Identifier' } }

    Plan:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        slug: { type: string }
        name: { type: string }
        package_id: { oneOf: [{ $ref: '#/components/schemas/Identifier' }, { type: 'null' }] }
        billing_period: { type: string, enum: [monthly, annual] }
        trial_days: { type: integer }
        device_limit: { type: integer }
        concurrency_limit:
          type: integer
          description: |
            The plan's commercial allowance. A licensor's contractual cap is
            separate and the lower of the two wins at playback.
        max_resolution: { type: [string, 'null'] }
        prices: { type: array, items: { $ref: '#/components/schemas/Money' } }

    Subscription:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        plan_id: { $ref: '#/components/schemas/Identifier' }
        status: { type: string, enum: [trialing, active, past_due, cancelled, expired] }
        started_at: { type: [string, 'null'], format: date-time }
        current_period_end: { type: [string, 'null'], format: date-time }
        trial_ends_at: { type: [string, 'null'], format: date-time }
        cancel_at_period_end: { type: boolean }

    DeliveryTarget:
      type: object
      properties:
        format: { type: string, enum: [hls, dash] }
        container:
          type: string
          description: |
            Independent of `format`. A device may need HLS with MPEG-TS rather
            than HLS with CMAF fMP4, which is a different problem from needing a
            different encryption scheme (ADR-0005).
          enum: [cmaf, ts]
        url:
          type: string
          format: uri
          description: |
            Everything that varies per viewer — the session, the expiry and the
            signature — is packed into a **single opaque query parameter**, so
            the path is byte-identical for every viewer of the same content at
            the same quality class. An edge therefore has exactly one parameter
            to exclude from its cache key; excluding none, or missing one of
            several, gives every viewer a private copy of every segment and
            collapses cache offload to zero.

            Clients must treat the URL as opaque and must not reconstruct it.
        priority: { type: integer }
        edge:
          type: string
          description: |
            Which delivery edge this target addresses. Reported in player
            telemetry so a quality problem can be attributed to an edge without
            parsing hostnames out of URLs.
        quality_class:
          type: string
          enum: [h576, h720, h1080, h2160, full]
          description: |
            The manifest variant this target points at. A licensor's
            `max_resolution` rule and a plan's cap are enforced by serving a
            manifest that does not mention the rungs the viewer may not have —
            never by asking the client to filter, because the client is never a
            security boundary.

            Surfaced so that a viewer who reports "it looks soft" is answered
            from the response rather than from an investigation.
        expires_at:
          type: string
          format: date-time
          description: |
            When this target's token stops working. Renew via the heartbeat
            before this instant; a client that does not simply stops receiving
            segments.

    PlaybackSession:
      type: object
      properties:
        session_id: { $ref: '#/components/schemas/Identifier' }
        decision_id:
          $ref: '#/components/schemas/Identifier'
        delivery:
          type: object
          properties:
            targets:
              type: array
              description: |
                An ordered list from day one, even when it holds a single entry.
                Clients that cannot handle a list would still be in the field
                years later, blocking multi-CDN adoption (ADR-0008).
              items: { $ref: '#/components/schemas/DeliveryTarget' }
            expires_at: { type: string, format: date-time }
        protection:
          type: 'null'
          description: DRM arrives in a later phase. Absent rather than stubbed.
        restrictions:
          type: object
          description: Rights-derived, never hardcoded.
          additionalProperties: true
        heartbeat_interval_seconds: { type: integer }

    Identifier:
      type: string
      format: uuid
      description: UUIDv7. Sequential integers are never exposed.
      examples: ['0199c1a4-7e3b-7c21-9f4d-2b6a8e05d913']

    Problem:
      type: object
      required: [type, title, status, code, correlation_id]
      properties:
        type: { type: string, format: uri }
        title:
          type: string
          description: Non-localised summary. Clients localise from the code, never from this.
        status: { type: integer }
        code:
          type: string
          description: |
            Stable machine-readable code. **Clients switch on this and never on
            prose.** A code's meaning never changes once shipped; the registry is
            append-only.
        detail: { type: string }
        instance: { type: string }
        correlation_id: { type: string }
        meta: { type: object, additionalProperties: true }

    ClientConfig:
      type: object
      properties:
        api:
          type: object
          properties:
            client_version: { type: string }
            features: { type: array, items: { type: string } }
        minimum_supported_version: { type: [string, 'null'] }
        upgrade_required: { type: boolean }
        upgrade_message_key:
          type: [string, 'null']
          description: A message key, never a message. The client localises.
        activation:
          type: object
          properties:
            poll_interval_seconds: { type: integer }
        limits:
          type: object
          properties:
            profiles: { type: integer }
            devices: { type: integer }

    RegisterRequest:
      type: object
      required: [email, password, profile_name, accepts_terms]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password:
          type: string
          minLength: 12
          maxLength: 4096
          description: Length over composition rules.
        profile_name: { type: string, minLength: 1, maxLength: 50 }
        locale: { type: string, maxLength: 20 }
        accepts_terms: { type: boolean }

    RegisterResponse:
      type: object
      properties:
        account:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Identifier' }
            email: { type: string }
            email_verified: { type: boolean }
        primary_profile_id: { $ref: '#/components/schemas/Identifier' }

    LoginRequest:
      type: object
      required: [email, password, device_class, device_name]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, maxLength: 4096 }
        device_class: { $ref: '#/components/schemas/PasswordDeviceClass' }
        device_name: { type: string, minLength: 1, maxLength: 100 }
        device_fingerprint:
          type: [string, 'null']
          maxLength: 512
          description: Stable per-installation value. Lets a known device sign in again without consuming another device slot.

    Session:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
        refresh_expires_at: { type: string, format: date-time }
        device_id: { $ref: '#/components/schemas/Identifier' }

    ActivationStart:
      type: object
      properties:
        user_code:
          type: string
          description: Displayed on the television.
        device_code:
          type: string
          description: The polling secret. As sensitive as a refresh token.
        verification_uri: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        interval:
          type: integer
          description: Minimum seconds between polls.

    Profile:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        name: { type: string }
        is_primary: { type: boolean }
        locale: { type: string }
        max_rating: { type: [string, 'null'] }
        has_pin:
          type: boolean
          description: Whether a PIN is set. The PIN itself is never returned.
        audio_language: { type: [string, 'null'] }
        subtitle_language: { type: [string, 'null'] }

    ProfileWrite:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        locale: { type: string, maxLength: 20 }
        max_rating: { type: [string, 'null'], maxLength: 20 }
        pin: { type: [string, 'null'], pattern: '^[0-9]{4}$' }
        audio_language: { type: [string, 'null'], maxLength: 20 }
        subtitle_language: { type: [string, 'null'], maxLength: 20 }

    Device:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Identifier' }
        name: { type: string }
        device_class: { $ref: '#/components/schemas/DeviceClass' }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        is_current: { type: boolean }

    DeviceClass:
      type: string
      description: |
        Authoritative platform data, not a display label: from Phase 4 it is an
        input to the rights and DRM decision. Treat as extensible — a client
        must skip a value it does not recognise rather than fail.
      enum: [web, mobile, tablet, androidtv, tizen, webos, stb]

    PasswordDeviceClass:
      type: string
      enum: [web, mobile, tablet]

    PairingDeviceClass:
      type: string
      enum: [androidtv, tizen, webos, stb]

security:
  - bearerAuth: []
